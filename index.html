
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Space</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='32' font-size='32'>🌌</text></svg>">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#02030b;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}
#stars{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 50% 20%,#202060,#02030b 55%)}
.star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;animation:tw 3s infinite}
@keyframes tw{50%{opacity:.2;transform:scale(2)}}
.glass{background:rgba(255,255,255,.08);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.18);box-shadow:0 0 40px #4b00ff55;border-radius:28px}
.panel{width:min(95%,900px);margin:70px auto;padding:28px;animation:float 5s infinite ease-in-out}
@keyframes float{50%{transform:translateY(-10px)}}
h1{font-size:clamp(35px,8vw,70px);background:linear-gradient(90deg,#00eaff,#b000ff);-webkit-background-clip:text;color:transparent}
button{border:0;border-radius:20px;padding:12px 20px;background:linear-gradient(90deg,#00eaff,#9b00ff);color:white;cursor:pointer}
input,textarea{width:100%;margin:8px 0;padding:12px;border-radius:15px;background:#0008;color:white;border:1px solid #ffffff44}
nav{position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:5}
#marquee{position:fixed;top:0;width:100%;white-space:nowrap;overflow:hidden;background:#0008;padding:8px;color:#0ff}
video,img{max-width:100%;border-radius:20px}.hidden{display:none}.chat{position:fixed;right:20px;bottom:20px}
</style>
</head>
<body>
<div id="stars"></div><div id="marquee">✨ 欢迎进入未来空间 ✨</div>
<nav class="glass"><button onclick="show('home')">主页</button><button onclick="show('login')">登录</button><button id="adminBtn" class="hidden" onclick="show('admin')">后台</button></nav>

<section id="login" class="panel glass">
<h1>NEON SPACE</h1>
<h2>数字账户登录 / 注册</h2>
<input id="uid" placeholder="数字账户">
<input id="pwd" type="password" placeholder="密码">
<button onclick="login()">进入</button>
<button onclick="register()">注册</button>
</section>

<section id="home" class="panel glass hidden">
<h1>未来短视频</h1>
<div id="profile"></div>
<input type="file" id="file" accept="video/*,image/*">
<button onclick="upload()">上传</button>
<div id="feed"></div>
<button class="chat" onclick="openChat()">💬</button>
</section>

<section id="admin" class="panel glass hidden">
<h1>控制中心</h1>
<button onclick="announce()">发送跑马灯</button>
<button onclick="clearChat()">删除聊天</button>
<button onclick="document.title=prompt('标题')||document.title">修改标题</button>
<div id="db"></div>
</section>

<div id="chat" class="glass panel hidden" style="position:fixed;right:10px;bottom:80px;width:330px">
<h3>实时聊天</h3><div id="msgs"></div>
<input id="msg"><button onclick="send()">发送</button>
</div>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
const supabase=createClient(
'https://pzcwzaoebvlghoahpcdr.supabase.co',
'sb_publishable_mzLfUNyJzIXTX04ORjOuYg_dt-23zIV'
)
let user=null;
const ADMIN='306680070';

for(let i=0;i<180;i++){let s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*3+'s';document.getElementById('stars').append(s)}
function show(x){for(let e of document.querySelectorAll('section'))e.classList.add('hidden');document.getElementById(x).classList.remove('hidden')}
window.show=show;

window.register=async()=>{let id=uid.value,p=pwd.value;await supabase.from('users').insert({id,password:p,info:''});alert('注册完成')}
window.login=async()=>{let {data}=await supabase.from('users').select('*').eq('id',uid.value).eq('password',pwd.value);if(data?.[0]){user=data[0];show('home');if(user.id==ADMIN)adminBtn.classList.remove('hidden');profile.innerHTML='账户:'+user.id}else alert('登录失败')}
window.upload=async()=>{if(!user)return;let f=file.files[0];if(!f)return;let path=user.id+'/'+Date.now()+f.name;await supabase.storage.from('media').upload(path,f);await supabase.from('posts').insert({uid:user.id,path});load()}
async function load(){let {data}=await supabase.from('posts').select('*').order('id',{ascending:false});feed.innerHTML='';data?.forEach(p=>feed.innerHTML+=`<div class=glass><p>${p.uid}</p><a href="${p.path}">${p.path}</a></div>`)}
window.openChat=()=>chat.classList.toggle('hidden');
window.send=async()=>{await supabase.from('chat').insert({uid:user.id,msg:msg.value,time:new Date().toISOString()});msg.value='';}
window.announce=()=>marquee.textContent=prompt('实时信息')||'';
window.clearChat=async()=>{await supabase.from('chat').delete().neq('id',0)}
load();
</script>
</body>
</html>
