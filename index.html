<body>
<canvas id="stars"></canvas><div class="orb a"></div><div class="orb b"></div>
<div class="app">
<section id="authView" class="login-shell">
 <div class="login-card glass">
  <div id="loginBrand" class="brand grad">清音 QINGYIN</div>
  <div class="sub">图片 · 视频 · 实时聊天 · 多人音视频</div>
  <div id="announcement" class="notice">欢迎来到清音。此版本按功能说明实现为可运行前端版，服务器能力由云端提供。</div>
  <div class="tabs"><button class="btn active" data-auth="login">登录</button><button class="btn" data-auth="register">注册</button></div>
  <form id="loginForm">
   <div class="field"><label>数字账号</label><input id="loginAccount" inputmode="numeric" pattern="[0-9]*" placeholder="请输入数字账号"></div>
   <div class="field"><label>密码</label><input id="loginPassword" type="password" placeholder="请输入密码"></div>
   <button class="btn primary" style="width:100%">登录</button>
  </form>
  <form id="registerForm" class="hidden">
   <div class="field"><label>数字账号</label><input id="regAccount" inputmode="numeric" placeholder="4–18 位数字"></div>
   <div class="field"><label>密码</label><input id="regPassword" type="password" placeholder="8–72 位"></div>
   <div class="field"><label>昵称（可选）</label><input id="regNickname" maxlength="32"></div>
   <button class="btn primary" style="width:100%">注册并登录</button>
  </form>
  <div class="tiny muted" style="margin-top:12px">管理员账号由云端认证管理</div>
 </div>
</section>
<section id="homeView" class="hidden">
 <div class="ticker"><div id="tickerTrack" class="ticker-track">欢迎来到清音 · 实时内容社区 · 请文明交流</div></div>
 <header class="topbar">
  <div class="top-left"><div id="topBrand" class="top-brand grad">清音</div><div class="stats"><span class="pill">通话 <b id="onlineCount">0</b></span><span class="pill">作品 <b id="mediaCount">0</b></span><span id="netState" class="pill">在线</span></div></div>
  <div class="top-actions"><button id="chatTopBtn" class="btn">聊天</button><button id="adminBtn" class="btn">后台</button><button id="avatarBtn" class="avatar">Q</button><button id="logoutBtn" class="btn">退出</button></div>
 </header>
 <main>
  <div class="category-bar"><div class="category-tabs"><button class="btn active" data-cat="video">视频</button><button class="btn" data-cat="image">照片</button><button id="similarHomeBtn" class="btn" data-cat="similar">相似组</button></div><div class="tiny muted" id="feedStatus"></div></div>
  <section id="feed" class="feed"></section>
  <div id="loadMoreWrap" style="text-align:center;margin:20px 0"><button id="loadMoreBtn" class="btn">加载更多</button></div>
 </main>
 <nav class="bottom"><button class="btn" data-open="uploadModal">＋上传</button><button class="btn" data-open="chatModal">聊天</button><button class="btn" data-open="shareModal">⌁分享</button><button class="btn" data-open="profileModal">◎资料</button></nav>
</section>
</div>

<div id="uploadModal" class="modal-wrap hidden"><div class="modal glass"><div class="modal-head"><h2>发布媒体</h2><button class="iconbtn" data-close>×</button></div>
 <div class="field"><label>选择图片或视频（支持多选）</label><input id="mediaFiles" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm" multiple></div>
 <div class="field"><label>作品描述</label><textarea id="caption" maxlength="180" placeholder="说点什么…"></textarea></div>
 <div class="grid2"><div class="field"><label>视频质量</label><select id="videoQuality"><option value="480" selected>480P 省流（推荐）</option><option value="720">720P（浏览器支持时）</option><option value="original">原始质量</option></select></div><div class="field"><label>重复策略</label><select id="dupMode"><option value="skip">完全重复自动跳过</option><option value="allow">允许重复</option></select></div></div>
 <div class="progress"><i id="uploadProgress"></i></div><div id="uploadLog" class="upload-log"></div>
 <div class="row" style="margin-top:12px"><button id="publishBtn" class="btn primary">开始发布</button><button id="importBtn" class="btn">从其他 APP/网页导入</button><input id="importMediaFile" class="hidden" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm" multiple></div>
</div></div>

<div id="viewerModal" class="modal-wrap hidden"><div class="modal wide glass"><div class="modal-head"><h2>作品 Viewer</h2><button class="iconbtn" data-close>×</button></div>
 <div id="viewerStage" class="viewer-stage"></div><div id="viewerInfo" style="margin-top:12px"></div>
 <div class="row" style="margin-top:12px"><button id="viewerShare" class="btn">分享</button><button id="viewerFull" class="btn">全屏</button><button id="viewerDelete" class="btn danger">删除</button></div>
</div></div>

<div id="profileModal" class="modal-wrap hidden"><div class="modal glass"><div class="modal-head"><h2>个人资料</h2><button class="iconbtn" data-close>×</button></div>
 <div class="grid2"><div><div class="field"><label>昵称</label><input id="profileNickname" maxlength="32"></div><div class="field"><label>个人简介</label><textarea id="profileBio" maxlength="240"></textarea></div><div class="field"><label>头像</label><input id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div><button id="saveProfile" class="btn primary">实时保存资料</button></div>
 <div><h3>主动位置共享</h3><div id="locStatus" class="notice">未共享位置</div><div class="row"><button id="shareLoc" class="btn">共享当前位置</button><button id="stopLoc" class="btn danger">停止共享</button></div><p class="tiny muted">只在你主动点击时请求浏览器定位权限。</p></div></div>
</div></div>

<div id="shareModal" class="modal-wrap hidden"><div class="modal glass"><div class="modal-head"><h2>分享清音</h2><button class="iconbtn" data-close>×</button></div>
 <div class="field"><label>站点地址</label><input id="shareUrl" readonly></div><div id="qr" style="width:220px;height:220px;margin:14px auto;border-radius:12px;background:#fff;padding:10px;display:grid;grid-template-columns:repeat(21,1fr);grid-template-rows:repeat(21,1fr);gap:1px"></div>
 <div class="row"><button id="copyShare" class="btn">复制链接</button><button id="systemShare" class="btn">系统分享</button><button id="installPwa" class="btn">添加到桌面</button></div>
</div></div>

<div id="chatModal" class="modal-wrap hidden"><div class="modal wide glass chat-box"><div class="modal-head"><h2>聊天与多人通话</h2><button class="iconbtn" data-close>×</button></div>
 <div><div class="tabs" style="margin-top:0"><button class="btn active" data-chat-channel="global">全部聊天</button><button class="btn" data-chat-channel="admin">联系管理员</button></div><div class="callbar"><button id="joinVideo" class="btn">加入视频</button><button id="joinAudio" class="btn">仅语音加入</button><button id="leaveCall" class="btn danger hidden">离开</button><button id="micBtn" class="btn hidden">麦克风</button><button id="camBtn" class="btn hidden">摄像头</button><button id="switchCamBtn" class="btn hidden">切换摄像头</button><button id="screenBtn" class="btn hidden">屏幕共享</button></div><div id="callStatus" class="tiny muted">未加入通话</div></div>
 <div id="callGrid" class="call-grid"></div><div id="messages" class="messages"></div><div class="composer"><textarea id="chatInput" maxlength="1000" placeholder="Enter 发送，Shift+Enter 换行"></textarea><button id="sendBtn" class="btn primary">发送</button></div>
</div></div>

<div id="adminModal" class="modal-wrap hidden"><div class="modal wide glass"><div class="modal-head"><h2>清音后台管理</h2><button class="iconbtn" data-close>×</button></div><div class="admin-layout"><aside class="admin-tabs"><button class="btn active" data-admin="users">用户</button><button class="btn" data-admin="visual">视觉</button><button class="btn" data-admin="content">内容</button><button class="btn" data-admin="system">系统</button><button class="btn" data-admin="tools">工具</button><button class="btn" data-admin="call">音视频</button></aside><section id="adminPanel" class="admin-panel"></section></div></div></div>

<div id="similarModal" class="modal-wrap hidden"><div class="modal wide glass"><div class="modal-head"><h2>相似 / 重复检测中心</h2><button class="iconbtn" data-close>×</button></div><div class="row"><button id="scanExactBtn" class="btn">扫描完全重复</button><button id="scanSimilarBtn" class="btn">扫描图片相似</button><label class="tiny muted">Hamming 阈值 <input id="similarThreshold" type="number" value="48" min="0" max="128" style="width:76px"></label></div><div id="similarResults"></div></div></div>

<div id="privateMsgModal" class="modal-wrap hidden"><div class="modal glass"><div class="modal-head"><h2>管理员私信</h2><button class="iconbtn" data-close>×</button></div><div id="privateTarget" class="notice"></div><div class="field"><textarea id="privateText" maxlength="1000"></textarea></div><button id="sendPrivateBtn" class="btn primary">发送私信</button></div></div>
<div id="toast" class="toast"></div>

<script>
'use strict';
// Qingyin production storage helpers
function qingyinStoragePath(url, bucket){
  const marker=`/storage/v1/object/public/${bucket}/`;
  const s=String(url||'');
  const i=s.indexOf(marker);
  return i>=0?decodeURIComponent(s.slice(i+marker.length).split('?')[0]):'';
}

async function qingyinRemoveOldBackground(oldUrl,key){
  const path=qingyinStoragePath(oldUrl,'backgrounds');
  if(!path) return;
  try{

    .on('postgres_changes',{event:'*',schema:'public',table:'chat_messages'},async()=>{if(session){const {data}=await sb.from('chat_messages').select('*').gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false}).limit(Math.max(1,Number(db.settings.runtime.chat_query_limit||300)));db.messages=(data||[]).reverse();renderMessages()}})
    .on('postgres_changes',{event:'*',schema:'public',table:'profiles'},syncPeople)
    .on('postgres_changes',{event:'*',schema:'public',table:'user_locations'},syncPeople)
    .on('postgres_changes',{event:'*',schema:'public',table:'site_settings'},()=>{
  clearTimeout(settingsSyncTimer);
  settingsSyncTimer=setTimeout(async()=>{
    try{await loadSettings();window.dispatchEvent(new CustomEvent('qingyin:appearance-updated'));renderFeed(true);renderMessages()}
    catch(e){console.error('settings sync',e)}
  },180);
})
    .subscribe();
}
$('#loginForm').onsubmit=async e=>{e.preventDefault();const a=$('#loginAccount').value.trim(),p=$('#loginPassword').value;if(!/^[0-9]+$/.test(a))return toast('账号必须全部为数字');const {data,error}=await sb.auth.signInWithPassword({email:a+'@numeric.local',password:p});if(error)return toast('登录失败：'+errText(error));session={user_id:data.user.id,access_token:data.session.access_token};await loadData();toast('登录成功，已连接云数据库')};
$('#registerForm').onsubmit=async e=>{e.preventDefault();const a=$('#regAccount').value.trim(),p=$('#regPassword').value,n=$('#regNickname').value.trim();try{const {data,error}=await sb.functions.invoke('numeric-register',{body:{account:a,password:p,nickname:n}});if(error)throw error;if(data?.ok===false)throw new Error(data.error);const r=await sb.auth.signInWithPassword({email:a+'@numeric.local',password:p});if(r.error)throw r.error;session={user_id:r.data.user.id,access_token:r.data.session.access_token};await loadData();toast('注册成功并已连接数据库')}catch(e){console.error('register error',e);toast('注册失败：'+errText(e))}};
$('#logoutBtn').onclick=async()=>{leaveCall(true);await sb.auth.signOut();session=null;showAuth();toast('已安全退出')};
openViewer=async function(id){const m=db.media.find(x=>x.id===id);if(!m)return toast('作品不存在或已删除');state.viewer=m;const stage=$('#viewerStage');stage.innerHTML=m.url?(m.type==='image'?`<img src="${esc(m.url)}" alt="">`:`<video src="${esc(m.url)}" controls autoplay playsinline></video>`):'<div class="notice">媒体不可用</div>';if(m.type==='video'){sb.functions.invoke('media-play',{body:{id:m.id}}).then(({data,error})=>{if(!error&&data?.count!=null){m.play_count=data.count;renderFeed();const info=$('#viewerInfo').querySelector('.muted');if(info)info.innerHTML=`${esc(m.duration||'00:00')} · ${m.play_count} 次播放 · ${fmtBytes(m.file_size)}`}})}$('#viewerInfo').innerHTML=`<b>@${esc(m.account)}</b><p>${esc(m.caption||'')}</p><div class="muted tiny">${m.type==='video'?`${esc(m.duration||'00:00')} · ${m.play_count||0} 次播放`:'照片'} · ${fmtBytes(m.file_size)}</div>`;$('#viewerDelete').classList.toggle('hidden',!(isAdmin()||m.user_id===me().id));openModal('viewerModal')};
$('#viewerDelete').onclick=async()=>{const m=state.viewer;if(!m||!confirm('确认删除此作品及对应 Storage 文件？'))return;const d=await sb.from('media_posts').delete().eq('id',m.id);if(d.error)return toast('删除失败：'+errText(d.error));if(m.object_path)await sb.storage.from('media').remove([m.object_path]);db.media=db.media.filter(x=>x.id!==m.id);closeModal('viewerModal');renderFeed(true);toast('作品已从数据库与 Storage 删除')};
$('#shareLoc').onclick=()=>{if(!navigator.geolocation)return toast('浏览器不支持定位');navigator.geolocation.getCurrentPosition(async p=>{const row={user_id:me().id,latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy_m:p.coords.accuracy,updated_at:new Date().toISOString()};const q=await sb.from('user_locations').upsert(row);if(q.error)return toast('位置保存失败：'+errText(q.error));me().location=row;renderLocation();toast('位置已保存到数据库')},()=>toast('暂时无法获取位置'),{enableHighAccuracy:true,timeout:12000,maximumAge:60000})};
$('#stopLoc').onclick=async()=>{const q=await sb.from('user_locations').delete().eq('user_id',me().id);if(q.error)return toast('删除失败：'+errText(q.error));me().location=null;renderLocation();toast('位置记录已删除')};
sb.auth.onAuthStateChange((event,s)=>{if(event==='SIGNED_OUT'){session=null;showAuth()}else if(s&&event==='SIGNED_IN'&&remote.ready){session={user_id:s.user.id,access_token:s.access_token};loadData().catch(console.error)}});
await boot();
})();

<script>
/* Qingyin runtime */
(()=>{
'use strict';
const sb=window.qingyinSupabase;
if(!sb){console.error('Supabase client missing');return;}
const errText=e=>e?.message||e?.error_description||e?.error||String(e||'未知错误');
let cloudRuntime={}, cloudAppearance={}, primaryAccount='306680070';
const callCloud={channel:null,peers:new Map(),remoteStreams:new Map(),pendingIce:new Map(),presence:{},joined:false,startedAt:null};
window.qingyinCallCloud=callCloud;

async function refreshCloudConfig(){
  const {data,error}=await sb.from('site_settings').select('key,value');
  if(error) throw error;
  const o=Object.fromEntries((data||[]).map(x=>[x.key,x.value||{}]));
  cloudRuntime=o.runtime||{};
  cloudAppearance=o.appearance||{};
  primaryAccount=String(cloudRuntime.admin?.primary_account||'306680070');
  window.qingyinAppearance=cloudAppearance;
  return o;
}
refreshCloudConfig().then(()=>{
  window.applyAppearance?.(window.qingyinAppearance||{});
  if(cloudAppearance.share_icon){let f=document.querySelector('link[rel="icon"]');if(!f){f=document.createElement('link');f.rel='icon';document.head.appendChild(f)}f.href=cloudAppearance.share_icon}
}).catch(console.error);

function currentRole(){return me()?.role||'user'}
async function ensureAdmin(){
  if(!isAdmin()) throw new Error('需要管理员权限');
  const {data,error}=await sb.functions.invoke('admin-api',{body:{action:'sync_primary_role'}});
  if(error||data?.error) throw error||new Error(data.error);
  return data;
}
async function adminInvoke(action,body={}){
  const {data,error}=await sb.functions.invoke('admin-api',{body:{action,...body}});
  if(error||data?.error) throw error||new Error(data.error);
  return data;
}
async function maintenanceInvoke(action,body={}){
  const {data,error}=await sb.functions.invoke('admin-maintenance',{body:{action,...body}});
  if(error||data?.error) throw error||new Error(data.error);
  return data;
}
async function listAdminUsers(){
  const data=await adminInvoke('list_users',{limit:db.settings.runtime.admin_list_limit||500});
  const users=(data.users||[]).map(x=>({id:x.id,account:x.account,nickname:x.profile?.nickname||'',bio:x.profile?.bio||'',avatar:x.profile?.avatar_url||'',role:x.role||'user',created_at:x.created_at,last_login:x.last_sign_in_at,location:x.location||null}));
  if(isAdmin()&&users.length){const q=await sb.from('user_locations').select('*').in('user_id',users.map(x=>x.id));if(!q.error){const lm=new Map((q.data||[]).map(x=>[x.user_id,x]));for(const u of users)u.location=lm.get(u.id)||u.location||null}}
  return users;
}
function storagePathFromPublicUrl(url,bucket='media'){const marker=`/storage/v1/object/public/${bucket}/`,v=String(url||''),i=v.indexOf(marker);return i>=0?decodeURIComponent(v.slice(i+marker.length).split('?')[0]):''}
async function removeMediaRows(rows){
  const paths=[...new Set(rows.flatMap(x=>[x.object_path,storagePathFromPublicUrl(x.cover_url,'media')]).filter(Boolean))];
  for(let i=0;i<paths.length;i+=100){
    const r=await sb.storage.from('media').remove(paths.slice(i,i+100));
    if(r.error) throw r.error;
  }
  const ids=rows.map(x=>x.id);
  for(let i=0;i<ids.length;i+=200){
    const r=await sb.from('media_posts').delete().in('id',ids.slice(i,i+200));
    if(r.error) throw r.error;
  }
}

// Normal-user admin chat now resolves the configured primary admin from profiles.
sendChat=async function(){
  if(!db.settings.features.chat_enabled)return toast('聊天已关闭');
  if(!navigator.onLine)return toast('当前网络不可用');
  const v=$('#chatInput').value.trim();
  if(!v)return;
  if(v.length>db.settings.runtime.chat_max_length)return toast('消息过长');
  const u=me(); if(!u)return toast('请先登录');
  let recipient=null;
  if(state.chatChannel==='admin'&&!isAdmin()){
    let admin=db.users.find(x=>x.account===primaryAccount);
    if(!admin){
      const q=await sb.from('profiles').select('*').eq('account',primaryAccount).maybeSingle();
      if(q.error)return toast('管理员账号读取失败：'+errText(q.error));
      if(q.data){admin={id:q.data.id,account:q.data.account,nickname:q.data.nickname||'',role:'superadmin',avatar:q.data.avatar_url||''};db.users.push(admin)}
    }
    recipient=admin?.id||null;
    if(!recipient)return toast('管理员账号不可用');
  }
  const q=await sb.from('chat_messages').insert({user_id:u.id,account:u.account,recipient_id:recipient,channel:state.chatChannel,content:v,expires_at:new Date(Date.now()+86400000).toISOString()}).select().single();
  if(q.error)return toast('发送失败：'+errText(q.error));
  $('#chatInput').value=''; if(!db.messages.some(x=>x.id===q.data.id))db.messages.push(q.data); renderMessages();
};
$('#sendBtn').onclick=()=>sendChat();
$('#chatInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat()}};

$('#sendPrivateBtn').onclick=async()=>{
  const t=$('#privateText').value.trim(); if(!t||!state.privateTarget)return;
  const u=me();
  const q=await sb.from('chat_messages').insert({user_id:u.id,account:u.account,recipient_id:state.privateTarget.id,channel:'admin',content:t,expires_at:new Date(Date.now()+86400000).toISOString()}).select().single();
  if(q.error)return toast('私信发送失败：'+errText(q.error));
  db.messages.push(q.data); closeModal('privateMsgModal'); toast('私信已发送到云端');
};

renderUsers=async function(p,ticket=adminRenderVersion){
  if(!isAdminRenderCurrent(p,ticket))return;
  p.innerHTML='<div class="notice">正在读取云端用户…</div>';
  try{
    await ensureAdmin();
    const loadedUsers=await listAdminUsers();if(!isAdminRenderCurrent(p,ticket))return;db.users=loadedUsers;
    const draw=()=>{
      const q=($('#userSearch')?.value||'').toLowerCase(), role=$('#roleFilter')?.value||'all';
      const us=db.users.filter(u=>(role==='all'||u.role===role)&&`${u.account} ${u.nickname} ${u.role}`.toLowerCase().includes(q));
      $('#usersTable').innerHTML=`<div class="table-wrap"><table><thead><tr><th>账号</th><th>昵称</th><th>角色</th><th>最近登录</th><th>定位</th><th>操作</th></tr></thead><tbody>${us.map(u=>`<tr><td>${esc(u.account)}</td><td>${esc(u.nickname)}</td><td>${esc(u.role)}${u.role==='superadmin'?' · ROOT':''}</td><td>${u.last_login?new Date(u.last_login).toLocaleString('zh-CN'):'-'}</td><td>${u.location?`${Number(u.location.latitude).toFixed(5)}, ${Number(u.location.longitude).toFixed(5)}<br><a href="https://maps.google.com/?q=${u.location.latitude},${u.location.longitude}" target="_blank" rel="noopener noreferrer" style="color:var(--cyan)">地图</a>`:'未共享'}</td><td>${u.role==='superadmin'?'<span class="muted">受保护</span>':`<button class="btn" data-pm="${u.id}">私信</button> <button class="btn" data-pw="${u.id}">改密码</button> <button class="btn danger" data-du="${u.id}">删除</button>`}</td></tr>`).join('')}</tbody></table></div><div class="tiny muted" style="margin-top:8px">显示 ${us.length} / ${db.users.length}</div>`;
      $$('[data-pm]').forEach(b=>b.onclick=()=>openPrivate(b.dataset.pm));
      $$('[data-pw]').forEach(b=>b.onclick=async()=>{const pw=prompt('输入新密码');if(!pw)return;try{await adminInvoke('set_password',{user_id:b.dataset.pw,password:pw});toast('密码已修改')}catch(e){toast('修改失败：'+errText(e))}});
      $$('[data-du]').forEach(b=>b.onclick=async()=>{const u=db.users.find(x=>x.id===b.dataset.du);if(!u||!confirm(`永久删除用户 @${u.account}？`))return;try{await maintenanceInvoke('delete_user',{user_id:u.id});const updatedUsers=await listAdminUsers();if(!isAdminRenderCurrent(p,ticket))return;db.users=updatedUsers;draw();toast('用户及关联文件已由服务器删除')}catch(e){toast('删除失败：'+errText(e))}});
    };
    p.innerHTML=`<div class="kpis"><div class="kpi"><div class="muted tiny">用户总数（当前载入）</div><b>${db.users.length}</b></div><div class="kpi"><div class="muted tiny">当前通话人数</div><b>${Object.values(callCloud.presence||{}).reduce((n,x)=>n+(x?.length||0),0)}</b></div><div class="kpi"><div class="muted tiny">视频作品</div><b>${db.media.filter(x=>x.type==='video').length}</b></div><div class="kpi"><div class="muted tiny">照片作品</div><b>${db.media.filter(x=>x.type==='image').length}</b></div></div><div class="row" style="margin-top:12px"><input id="userSearch" placeholder="搜索账号/昵称/角色" style="flex:1;background:rgba(2,6,23,.58);border:1px solid var(--line);border-radius:12px;padding:10px"><select id="roleFilter" style="background:rgba(2,6,23,.58);border:1px solid var(--line);border-radius:12px;padding:10px"><option value="all">全部角色</option><option>superadmin</option><option>admin</option><option>user</option></select>${isSuper()?'<button id="createAdmin" class="btn">创建管理员</button>':''}</div><div id="usersTable"></div>`;
    $('#userSearch').oninput=draw; $('#roleFilter').onchange=draw; draw();
    if($('#createAdmin'))$('#createAdmin').onclick=async()=>{const a=prompt('管理员数字账号');if(!a)return;const pw=prompt('密码');if(!pw)return;const nick=prompt('昵称（可选）')||'';try{await adminInvoke('create_admin',{account:a,password:pw,nickname:nick});const updatedUsers=await listAdminUsers();if(!isAdminRenderCurrent(p,ticket))return;db.users=updatedUsers;draw();toast('管理员已创建')}catch(e){toast('创建失败：'+errText(e))}};
  }catch(e){if(isAdminRenderCurrent(p,ticket))p.innerHTML=`<div class="notice danger-text">读取失败：${esc(errText(e))}</div>`}
};

function backgroundPreview(url,id){
  return url ? `<div id="${id}" class="bg-preview" style="background-image:url('${esc(url)}')"></div>` : `<div id="${id}" class="bg-preview"><div style="padding:60px 12px;text-align:center;color:#96a3bb">暂无当前背景</div></div>`;
}

renderVisual=async function(p,ticket=adminRenderVersion){
  if(!isAdminRenderCurrent(p,ticket))return;
  try{await refreshCloudConfig()}catch{}
  if(!isAdminRenderCurrent(p,ticket))return;
  const a=cloudAppearance||{};
  p.innerHTML=`<h3>站点视觉与运行外观</h3><div class="grid2"><div class="field"><label>网页标题</label><input id="setTitle" value="${esc(db.settings.title)}"></div><div class="field"><label>跑马灯</label><input id="setTicker" value="${esc(db.settings.ticker)}"></div></div><div class="field"><label>登录公告</label><textarea id="setAnn">${esc(db.settings.announcement)}</textarea></div><div class="grid3"><div class="field"><label>登录页背景遮罩强度（最高60%）</label><input id="glassLogin" type="range" min="0" max="1" step=".01" value="${a.login_opacity??0}"></div><div class="field"><label>主页背景遮罩强度（最高60%）</label><input id="glassHome" type="range" min="0" max="1" step=".01" value="${a.home_opacity??0}"></div><div class="field"><label>后台背景遮罩强度（最高60%）</label><input id="glassAdmin" type="range" min="0" max="1" step=".01" value="${a.admin_opacity??0}"></div></div><div class="grid2">
<div class="field"><label>登录背景图（当前）</label>${backgroundPreview(a.login_bg,'loginBgPreview')}<input id="loginBgFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div>
<div class="field"><label>主页背景图（当前）</label>${backgroundPreview(a.home_bg,'homeBgPreview')}<input id="homeBgFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div>
<div class="field"><label>后台背景图（当前）</label>${backgroundPreview(a.admin_bg,'adminBgPreview')}<input id="adminBgFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div>
<div class="field"><label>分享图标（当前）</label>${backgroundPreview(a.share_icon,'shareIconPreview')}<input id="shareIconFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div>
</div><div class="tiny muted">背景与分享图将上传到 Supabase Storage / backgrounds。</div><button id="saveVisual" class="btn primary" style="margin-top:12px">保存视觉设置</button>`;
  async function uploadVisual(input,key,max,existing){const f=$(input).files[0];if(!f)return existing||'';if(!['image/jpeg','image/png','image/webp','image/gif'].includes(f.type))throw new Error('仅支持 JPEG、PNG、WebP 或 GIF 图片');if(f.size>max)throw new Error('图片文件过大');const ext=(f.name.split('.').pop()||'bin').replace(/[^a-zA-Z0-9]/g,'')||'img',path=`site/${key}_${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;const up=await sb.storage.from('backgrounds').upload(path,f,{contentType:f.type,upsert:false});if(up.error)throw up.error;const url=sb.storage.from('backgrounds').getPublicUrl(path).data.publicUrl+'?v='+Date.now();if(!await preloadAppearance(url)){await sb.storage.from('backgrounds').remove([path]);throw new Error('背景已上传，但无法从 Storage 读取；旧背景和透明度设置未更改')}return url}
  const bgDraft={},bgObjectUrls=new Map();
  const previewAppearance=()=>{const globalAppearance=window.qingyinAppearance,base=globalAppearance&&Object.keys(globalAppearance).length?globalAppearance:(cloudAppearance&&Object.keys(cloudAppearance).length?cloudAppearance:a),live={...base,...bgDraft,login_opacity:+$('#glassLogin').value,home_opacity:+$('#glassHome').value,admin_opacity:+$('#glassAdmin').value};window.qingyinAppearance=live;window.applyAppearance?.(live)};
  const previewFile=(input,key,previewId,maxBytes)=>{const el=$(input),file=el?.files?.[0],preview=$('#'+previewId);if(!file)return;if(!['image/jpeg','image/png','image/webp','image/gif'].includes(file.type)){el.value='';toast('仅支持 JPEG、PNG、WebP 或 GIF 图片');return}if(file.size>maxBytes){el.value='';toast('图片文件超过大小限制');return}const old=bgObjectUrls.get(key);if(old)URL.revokeObjectURL(old);const blob=URL.createObjectURL(file);bgObjectUrls.set(key,blob);if(key.endsWith('_bg'))bgDraft[key]=blob;if(preview){preview.style.backgroundImage=`url("${blob}")`;preview.innerHTML=''}previewAppearance()};
  const bgLimit=db.settings.runtime.background_max_upload_bytes||10485760,iconLimit=db.settings.runtime.share_icon_max_upload_bytes||5242880;
  [['#loginBgFile','login_bg','loginBgPreview',bgLimit],['#homeBgFile','home_bg','homeBgPreview',bgLimit],['#adminBgFile','admin_bg','adminBgPreview',bgLimit],['#shareIconFile','share_icon','shareIconPreview',iconLimit]].forEach(([input,key,preview,max])=>$(input)?.addEventListener('change',()=>previewFile(input,key,preview,max)));
  ['glassLogin','glassHome','glassAdmin'].forEach(id=>$('#'+id)?.addEventListener('input',previewAppearance));
  $('#saveVisual').onclick=async()=>{const button=$('#saveVisual');if(button.disabled)return;button.disabled=true;try{const latest=await currentAppearance(),maxBg=db.settings.runtime.background_max_upload_bytes||10485760,maxIcon=db.settings.runtime.share_icon_max_upload_bytes||5242880;const appearance={...latest,title:$('#setTitle').value.trim()||'清音',login_opacity:+$('#glassLogin').value,home_opacity:+$('#glassHome').value,admin_opacity:+$('#glassAdmin').value};appearance.login_bg=await uploadVisual('#loginBgFile','login',maxBg,latest.login_bg);appearance.home_bg=await uploadVisual('#homeBgFile','home',maxBg,latest.home_bg);appearance.admin_bg=await uploadVisual('#adminBgFile','admin',maxBg,latest.admin_bg);appearance.share_icon=await uploadVisual('#shareIconFile','share_icon',maxIcon,latest.share_icon);for(const key of ['login_bg','home_bg','admin_bg'])if(appearance[key]&&!await preloadAppearance(appearance[key]))throw new Error('背景链接无法读取，设置未保存；请在后台重新选择并上传该背景');const ar=await sb.from('site_settings').upsert({key:'appearance',value:appearance}).select('key,value').single();if(ar.error)throw ar.error;const persisted=await currentAppearance();for(const key of ['login_bg','home_bg','admin_bg'])if((persisted[key]||'')!==(appearance[key]||''))throw new Error('背景链接没有成功写入数据库，请重新登录后台后再试');const tr=await sb.from('site_settings').upsert({key:'ticker',value:{text:$('#setTicker').value.trim()}});if(tr.error)throw tr.error;const an=await sb.from('site_settings').upsert({key:'announcement',value:{text:$('#setAnn').value.trim()}});if(an.error)throw an.error;cloudAppearance=persisted;window.qingyinAppearance=persisted;window.applyAppearance?.(persisted);db.settings.title=persisted.title||'清音';db.settings.ticker=$('#setTicker').value.trim();db.settings.announcement=$('#setAnn').value.trim();applySettings();for(const url of bgObjectUrls.values())URL.revokeObjectURL(url);bgObjectUrls.clear();Object.keys(bgDraft).forEach(key=>delete bgDraft[key]);toast('背景已验证写入数据库并立即生效');await renderVisual(p,ticket)}catch(e){console.error('visual/background save failed',e);toast('保存失败：'+errText(e))}finally{if(button.isConnected)button.disabled=false}};
};

renderContent=async function(p,ticket=adminRenderVersion){

scanSimilar=async function(){try{let groups;if(isAdmin()){const d=await adminInvoke('find_similar_images',{threshold:+$('#similarThreshold').value||48,limit:db.settings.runtime.dedup_query_limit||1000});const pairs=d.data||[];const parent=new Map(db.media.filter(m=>m.type==='image').map(x=>[x.id,x.id]));const find=x=>parent.get(x)===x?x:(parent.set(x,find(parent.get(x))),parent.get(x));const un=(a,b)=>{if(!parent.has(a)||!parent.has(b))return;a=find(a);b=find(b);if(a!==b)parent.set(b,a)};for(const x of pairs)un(x.duplicate_id,x.keeper_id);const gm={};for(const m of db.media.filter(x=>x.type==='image'&&parent.has(x.id)))(gm[find(m.id)]??=[]).push(m);groups=Object.values(gm).filter(g=>g.length>1).map(g=>g.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)))}else groups=getSimilarGroups();renderCloudDupGroups(groups,'相似图片')}catch(e){toast('相似扫描失败：'+errText(e));renderCloudDupGroups(getSimilarGroups(),'相似图片（本地哈希）')}};

// --- Real multi-party WebRTC using Supabase Realtime broadcast + presence ---
function callUser(){const u=me();return u?{id:u.id,account:u.account,nickname:u.nickname||u.account,mode:state.callMode||'audio',joined_at:callCloud.startedAt||new Date().toISOString()}:null}
async function ensureCallChannel(){
  if(callCloud.channel)return callCloud.channel;
  const ch=sb.channel('qingyin-live-call',{config:{presence:{key:me()?.id||uid()},broadcast:{self:false}}});
  ch.on('broadcast',{event:'signal'},({payload})=>handleSignal(payload));
  ch.on('presence',{event:'sync'},()=>{callCloud.presence=ch.presenceState();handlePresence();renderCallUI()});
  ch.on('presence',{event:'leave'},({key})=>{closePeer(key);renderCallUI()});
  callCloud.channel=ch;
  await new Promise((resolve,reject)=>{ch.subscribe(async status=>{if(status==='SUBSCRIBED'){if(callCloud.joined)await ch.track(callUser());resolve()}else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')reject(new Error('通话信令频道连接失败'))})});
  return ch;
}
function peerInfo(id){const arr=callCloud.presence[id]||[];return arr[0]||{id,account:id.slice(0,6),nickname:id.slice(0,6)}}
function makePeer(peerId){
  if(callCloud.peers.has(peerId))return callCloud.peers.get(peerId);
  const pc=new RTCPeerConnection({iceServers:db.settings.runtime.ice_servers||[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});
  for(const t of state.localStream?.getTracks()||[])pc.addTrack(t,state.localStream);
  pc.onicecandidate=e=>{if(e.candidate)sendSignal(peerId,{type:'ice',candidate:e.candidate})};
  pc.ontrack=e=>{const s=e.streams?.[0]||new MediaStream([e.track]);callCloud.remoteStreams.set(peerId,s);renderCallUI()};
  pc.onconnectionstatechange=()=>{if(['failed','closed','disconnected'].includes(pc.connectionState)){if(pc.connectionState!=='disconnected')closePeer(peerId)}renderCallUI()};
  callCloud.peers.set(peerId,pc); return pc;
}
async function sendSignal(to,data){if(!callCloud.channel)return;await callCloud.channel.send({type:'broadcast',event:'signal',payload:{from:me().id,to,...data}})}
async function createOffer(peerId){const pc=makePeer(peerId);if(pc.signalingState!=='stable')return;const offer=await pc.createOffer();await pc.setLocalDescription(offer);await sendSignal(peerId,{type:'offer',sdp:offer})}
async function flushPendingIce(peerId,pc){const pending=callCloud.pendingIce.get(peerId)||[];for(const candidate of pending){try{await pc.addIceCandidate(candidate)}catch(e){console.warn('pending ice',e)}}callCloud.pendingIce.delete(peerId)}
async function handleSignal(msg){try{if(!callCloud.joined||!msg||msg.to!==me()?.id||msg.from===me()?.id)return;const pc=makePeer(msg.from);if(msg.type==='offer'){await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));await flushPendingIce(msg.from,pc);const ans=await pc.createAnswer();await pc.setLocalDescription(ans);await sendSignal(msg.from,{type:'answer',sdp:ans})}else if(msg.type==='answer'){if(pc.signalingState==='have-local-offer'){await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));await flushPendingIce(msg.from,pc)}}else if(msg.type==='ice'&&msg.candidate){if(pc.remoteDescription?.type){try{await pc.addIceCandidate(msg.candidate)}catch(e){console.warn('ice',e)}}else{const pending=callCloud.pendingIce.get(msg.from)||[];pending.push(msg.candidate);callCloud.pendingIce.set(msg.from,pending)}}}catch(e){console.error('signal',e)}}
function handlePresence(){if(!callCloud.joined||!me())return;const ids=Object.keys(callCloud.presence).filter(id=>id!==me().id);for(const id of ids){if(me().id.localeCompare(id)<0&&!callCloud.peers.has(id))createOffer(id).catch(console.error)}for(const id of [...callCloud.peers.keys()])if(!ids.includes(id))closePeer(id)}
function closePeer(id){const pc=callCloud.peers.get(id);if(pc){pc.ontrack=null;pc.close()}callCloud.peers.delete(id);callCloud.remoteStreams.delete(id);callCloud.pendingIce.delete(id)}
joinCall=async function(mode){if(!window.isSecureContext)return toast('音视频需要 HTTPS 安全上下文');if(!navigator.mediaDevices?.getUserMedia)return toast('浏览器不支持 getUserMedia');try{state.localStream=await navigator.mediaDevices.getUserMedia(mode==='video'?{audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:{width:{ideal:640},height:{ideal:480},facingMode:state.facing}}:{audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});state.callJoined=true;state.callMode=mode;callCloud.joined=true;callCloud.startedAt=new Date().toISOString();const ch=await ensureCallChannel();await ch.track(callUser());handlePresence();renderCallUI();toast(mode==='video'?'已加入多人视频通话':'已加入多人语音通话')}catch(e){state.localStream?.getTracks().forEach(t=>t.stop());state.localStream=null;state.callJoined=false;callCloud.joined=false;toast('加入通话失败：'+errText(e))}};
leaveCall=async function(silent=false){for(const id of [...callCloud.peers.keys()])closePeer(id);if(callCloud.channel&&callCloud.joined)try{await callCloud.channel.untrack()}catch{}state.localStream?.getTracks().forEach(t=>t.stop());state.screenStream?.getTracks().forEach(t=>t.stop());state.localStream=state.screenStream=null;state.callJoined=false;state.callMode=null;callCloud.joined=false;callCloud.startedAt=null;renderCallUI();if(!silent)toast('已离开多人通话并释放媒体 Track')};
renderCallUI=function(){const joined=state.callJoined;['joinVideo','joinAudio'].forEach(id=>$('#'+id)?.classList.toggle('hidden',joined));['leaveCall','micBtn','camBtn','screenBtn'].forEach(id=>$('#'+id)?.classList.toggle('hidden',!joined));$('#switchCamBtn')?.classList.toggle('hidden',!joined||state.callMode!=='video');const participants=Object.values(callCloud.presence||{}).reduce((n,x)=>n+(x?.length||0),0);if($('#callStatus'))$('#callStatus').textContent=joined?`已加入 · ${state.callMode==='video'?'视频':'仅语音'} · Realtime Presence ${participants} 人`:'未加入通话';updateCounts();const g=$('#callGrid');if(!g)return;g.innerHTML='';if(joined){const addTile=(stream,label,muted=false)=>{const tile=document.createElement('div');tile.className='call-tile';if(stream?.getVideoTracks().length){const v=document.createElement('video');v.autoplay=true;v.playsInline=true;v.muted=muted;v.srcObject=stream;tile.appendChild(v)}else tile.innerHTML='<div>🎧 仅语音</div>';const l=document.createElement('span');l.className='call-label';l.textContent=label;tile.appendChild(l);g.appendChild(tile)};addTile(state.screenStream||state.localStream,'你 · @'+me().account,true);for(const [id,s] of callCloud.remoteStreams){const inf=peerInfo(id);addTile(s,(inf.nickname||inf.account||id)+' · @'+(inf.account||''),false)}}};
$('#joinVideo').onclick=()=>joinCall('video'); $('#joinAudio').onclick=()=>joinCall('audio'); $('#leaveCall').onclick=()=>leaveCall();
$('#micBtn').onclick=()=>{const t=state.localStream?.getAudioTracks()[0];if(!t)return toast('当前没有音频 Track');t.enabled=!t.enabled;toast(t.enabled?'麦克风已开启':'麦克风已关闭')};
$('#camBtn').onclick=()=>{const t=state.localStream?.getVideoTracks()[0];if(!t)return toast('当前没有摄像头 Track');t.enabled=!t.enabled;toast(t.enabled?'摄像头已开启':'摄像头已关闭')};
$('#switchCamBtn').onclick=async()=>{if(!state.callJoined)return;state.facing=state.facing==='user'?'environment':'user';try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:state.facing},audio:false});const nt=s.getVideoTracks()[0],ot=state.localStream.getVideoTracks()[0];if(ot){for(const pc of callCloud.peers.values()){const sender=pc.getSenders().find(x=>x.track===ot);if(sender)await sender.replaceTrack(nt)}state.localStream.removeTrack(ot);ot.stop()}state.localStream.addTrack(nt);renderCallUI();toast('摄像头已切换')}catch(e){toast('无法切换摄像头：'+errText(e))}};
async function renegotiatePeer(peerId,pc){if(pc.signalingState!=='stable')return;const offer=await pc.createOffer();await pc.setLocalDescription(offer);await sendSignal(peerId,{type:'offer',sdp:offer})}
async function stopScreenShare(showToast=true){const currentCamera=state.localStream?.getVideoTracks()[0]||null;const screenTracks=state.screenStream?.getVideoTracks()||[];for(const [peerId,pc] of callCloud.peers){const screenSender=pc.getSenders().find(x=>screenTracks.includes(x.track));if(screenSender){if(currentCamera)await screenSender.replaceTrack(currentCamera);else{try{pc.removeTrack(screenSender)}catch{};await renegotiatePeer(peerId,pc)}}else{const videoSender=pc.getSenders().find(x=>x.track?.kind==='video');if(videoSender&&currentCamera)await videoSender.replaceTrack(currentCamera)}}state.screenStream?.getTracks().forEach(t=>{t.onended=null;t.stop()});state.screenStream=null;renderCallUI();if(showToast)toast('屏幕共享已结束')}
$('#screenBtn').onclick=async()=>{try{if(state.screenStream)return await stopScreenShare(true);const ss=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});const st=ss.getVideoTracks()[0];state.screenStream=ss;for(const [peerId,pc] of callCloud.peers){const sender=pc.getSenders().find(x=>x.track?.kind==='video');if(sender)await sender.replaceTrack(st);else{pc.addTrack(st,ss);await renegotiatePeer(peerId,pc)}}st.onended=()=>{if(state.screenStream)stopScreenShare(true).catch(console.error)};renderCallUI();toast('正在共享屏幕')}catch(e){toast('未开始屏幕共享：'+errText(e))}};
renderCallAdmin=function(p){const entries=Object.entries(callCloud.presence||{}).flatMap(([id,a])=>(a||[]).map(x=>({id,...x})));p.innerHTML=`<h3>音视频 Presence 监控</h3><div class="kpis"><div class="kpi"><div class="muted tiny">通话人数</div><b>${entries.length}</b></div><div class="kpi"><div class="muted tiny">视频人数</div><b>${entries.filter(x=>x.mode==='video').length}</b></div><div class="kpi"><div class="muted tiny">仅语音人数</div><b>${entries.filter(x=>x.mode==='audio').length}</b></div><div class="kpi"><div class="muted tiny">监控模式</div><b>Realtime</b></div></div><div class="notice">管理员页只读取 Presence 元数据，不接收、不播放、不录制其他人的通话媒体。</div><div class="table-wrap"><table><thead><tr><th>账号</th><th>昵称</th><th>加入时间</th><th>模式</th></tr></thead><tbody>${entries.length?entries.map(x=>`<tr><td>${esc(x.account||'')}</td><td>${esc(x.nickname||'')}</td><td>${x.joined_at?new Date(x.joined_at).toLocaleString('zh-CN'):'-'}</td><td>${x.mode==='video'?'视频':'仅语音'}</td></tr>`).join(''):'<tr><td colspan="4">当前无人通话</td></tr>'}</tbody></table></div>`};

window.addEventListener('beforeunload',()=>{try{leaveCall(true)}catch{}});

// Replace stale demo text after cloud integration.
const ann=$('#announcement'); if(ann&&ann.textContent.includes('本地模拟'))ann.textContent='欢迎来到清音。云端数据库、Storage、Realtime 已连接。';
})();
</script>

<script>
/* Qingyin runtime */
(()=>{
'use strict';
const sb=window.qingyinSupabase;
if(!sb)return;
const errText=e=>e?.message||e?.error_description||e?.error||String(e||'未知错误');
const PUBLIC_MEDIA_MARK='/storage/v1/object/public/media/';
function mediaPathFromUrl(url){
  const s=String(url||''),i=s.indexOf(PUBLIC_MEDIA_MARK);
  return i>=0?decodeURIComponent(s.slice(i+PUBLIC_MEDIA_MARK.length).split('?')[0]):'';
}
function safeName(name){return String(name||'file').replace(/[^a-zA-Z0-9._-]+/g,'_')}
async function currentAppearance(){
  const q=await sb.from('site_settings').select('value').eq('key','appearance').maybeSingle();
  if(q.error)throw q.error;
  return q.data?.value||{};
}
let appearanceRevision=0;const appearancePreloads=new Map();
function preloadAppearance(url){
  if(!url)return Promise.resolve(null);
  if(!appearancePreloads.has(url)){
    const pending=new Promise(resolve=>{const img=new Image();img.onload=()=>resolve(url);img.onerror=()=>{appearancePreloads.delete(url);resolve(null)};img.src=url});
    appearancePreloads.set(url,pending);
    if(appearancePreloads.size>12)appearancePreloads.delete(appearancePreloads.keys().next().value);
  }
  return appearancePreloads.get(url);
}
window.applyAppearance=function(a={}){
  const revision=++appearanceRevision,clamp=v=>Math.max(0,Math.min(1,Number(v??0))),fallback='radial-gradient(circle at 15% 10%,rgba(60,231,255,.10),transparent 24%),radial-gradient(circle at 88% 12%,rgba(141,100,255,.12),transparent 26%),linear-gradient(180deg,#080b18,#04050b 72%)';
  const paint=async(el,url,opacity,mode='cover',position='center center')=>{
    if(!el)return;
    el.style.backgroundColor='#060812';el.style.backgroundRepeat='no-repeat';el.style.backgroundPosition=position;el.style.backgroundAttachment=el.closest('#adminModal')?'scroll':'fixed';el.style.backgroundSize=mode;
    if(!url){el.style.backgroundImage=fallback;return}
    const ready=await preloadAppearance(url);
    if(revision!==appearanceRevision||!el.isConnected)return;
    el.style.backgroundImage=ready?`linear-gradient(rgba(6,8,18,${(clamp(opacity)*0.6)}),rgba(6,8,18,${(clamp(opacity)*0.6)})),url("${ready}")`:fallback;
  };
  paint($('#authView'),a.login_bg,a.login_opacity);
  paint($('#homeView'),a.home_bg,a.home_opacity);
  paint($('#adminModal .modal'),a.admin_bg,a.admin_opacity);
};
// Appearance is loaded from site_settings by boot(); do not hydrate stale browser copies.


// Remove misleading local-demo credentials from the real cloud build.
try{
  $('#loginAccount').value=''; $('#loginAccount').placeholder='请输入数字账号';
  $('#loginPassword').value=''; $('#loginPassword').placeholder='请输入密码';
  const hint=[...document.querySelectorAll('#authView .tiny')].find(x=>x.textContent.includes('演示管理员'));
  if(hint)hint.textContent='账号与密码由 Supabase Auth 验证';
}catch{}

// Real QR code instead of the old decorative pseudo-QR.
renderQR=function(){
  const q=$('#qr'); if(!q)return;
  q.style.display='block';q.style.padding='10px';q.innerHTML='';
  const value=(location.protocol.startsWith('http')?location.href.split('?')[0]:'');
  if(!value){q.innerHTML='<div style="color:#111;padding:20px">部署到 HTTPS 后生成二维码</div>';return}
  if(window.QRCode?.toCanvas){
    const c=document.createElement('canvas');q.appendChild(c);
    window.QRCode.toCanvas(c,value,{width:200,margin:1,errorCorrectionLevel:'M'},err=>{if(err)q.textContent='二维码生成失败'});
  }else q.innerHTML='<div style="color:#111;padding:20px;word-break:break-all">'+esc(value)+'</div>';
};

async function blobVideoInfo(blob){
  return await new Promise(res=>{const v=document.createElement('video'),u=URL.createObjectURL(blob);v.preload='metadata';v.onloadedmetadata=()=>{res({duration:v.duration||0,width:v.videoWidth||0,height:v.videoHeight||0});URL.revokeObjectURL(u)};v.onerror=()=>{res({duration:0,width:0,height:0});URL.revokeObjectURL(u)};v.src=u});
}
function recorderMime(){
  const opts=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  return opts.find(x=>window.MediaRecorder?.isTypeSupported?.(x))||'';
}
async function transcodeVideo(file,quality,log=()=>{}){
  if(quality==='original'||!window.MediaRecorder)return file;
  const targetH=quality==='480'?Number(db.settings.runtime.video_height_480||480):Number(db.settings.runtime.video_height_720||720);
  return await new Promise(async(resolve)=>{
    const url=URL.createObjectURL(file),v=document.createElement('video');
    v.src=url;v.playsInline=true;v.muted=true;v.preload='auto';
    try{await new Promise((ok,bad)=>{v.onloadedmetadata=ok;v.onerror=bad});
      if(!v.videoHeight||v.videoHeight<=targetH){URL.revokeObjectURL(url);return resolve(file)}
      const scale=targetH/v.videoHeight,w=Math.max(2,Math.round(v.videoWidth*scale/2)*2),h=Math.max(2,Math.round(targetH/2)*2);
      const c=document.createElement('canvas');c.width=w;c.height=h;const cx=c.getContext('2d');
      const canvasStream=c.captureStream(30),source=v.captureStream?.()||v.mozCaptureStream?.();
      if(source)for(const t of source.getAudioTracks())canvasStream.addTrack(t);
      const mime=recorderMime();const chunks=[];const bitrate=quality==='480'?Number(db.settings.runtime.video_bitrate_480||1200000):Number(db.settings.runtime.video_bitrate_720||2500000);
      const rec=new MediaRecorder(canvasStream,{...(mime?{mimeType:mime}:{}),videoBitsPerSecond:bitrate});
      rec.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};
      rec.onstop=()=>{URL.revokeObjectURL(url);const b=new Blob(chunks,{type:mime||'video/webm'});resolve(b.size?new File([b],file.name.replace(/\.[^.]+$/, '')+`_${quality}p.webm`,{type:b.type,lastModified:Date.now()}):file)};
      let raf=0;const draw=()=>{if(v.ended||v.paused)return;cx.drawImage(v,0,0,w,h);raf=requestAnimationFrame(draw)};
      rec.start(1000);await v.play();draw();log(`正在转码为 ${quality}P…`);
      v.onended=()=>{cancelAnimationFrame(raf);try{rec.stop()}catch{resolve(file)}};
    }catch(e){URL.revokeObjectURL(url);console.warn('transcode fallback',e);resolve(file)}
  });
}
async function makeVideoCover(file){
  return await new Promise(resolve=>{
    const v=document.createElement('video'),url=URL.createObjectURL(file);v.preload='metadata';v.muted=true;v.playsInline=true;
    const finish=()=>{URL.revokeObjectURL(url)};
    v.onloadedmetadata=()=>{v.currentTime=Math.min(1,Math.max(0,(v.duration||0)/4))};
    v.onseeked=()=>{try{const maxW=960,scale=Math.min(1,maxW/(v.videoWidth||maxW)),c=document.createElement('canvas');c.width=Math.max(2,Math.round((v.videoWidth||640)*scale));c.height=Math.max(2,Math.round((v.videoHeight||360)*scale));c.getContext('2d').drawImage(v,0,0,c.width,c.height);c.toBlob(b=>{finish();resolve(b)},'image/jpeg',.82)}catch{finish();resolve(null)}};
    v.onerror=()=>{finish();resolve(null)};v.src=url;
  });
}

// Full cloud uploader: selected quality is honored and videos get cover images.
publishFiles=async function(files){
  if(!db.settings.features.uploads_enabled)return toast('上传已关闭');
  if(!files.length)return toast('请选择图片或视频');
  const user=(await sb.auth.getUser()).data.user;if(!user)return toast('请先登录');
  $('#publishBtn').disabled=true;$('#uploadLog').innerHTML='';let ok=0,skip=0,idx=0;
  for(const original of files){idx++;
    try{
      if(!/^(image|video)\//.test(original.type))throw new Error('类型不支持');if(original.type.startsWith('image/')&&!['image/jpeg','image/png','image/webp','image/gif'].includes(original.type))throw new Error('图片仅支持 JPEG、PNG、WebP 或 GIF');if(original.type.startsWith('video/')&&!['video/mp4','video/webm'].includes(original.type))throw new Error('视频仅支持 MP4 或 WebM');
      if(original.size>db.settings.runtime.max_upload_bytes)throw new Error(`超过 ${fmtBytes(db.settings.runtime.max_upload_bytes)}`);
      progress(Math.round((idx-1)/files.length*100)+3);logUpload(`${original.name}：计算 SHA-256…`);
      const hash=await sha256(original);
      if($('#dupMode').value==='skip'){const q=await sb.from('media_posts').select('id').eq('content_hash',hash).limit(1);if(q.error)throw q.error;if(q.data?.length){skip++;logUpload(`${original.name}：完全重复，已跳过`);continue}}
      const isVideo=original.type.startsWith('video/');let ih='',file=original;
      if(!isVideo){ih=await imageHash(original).catch(()=>randomHash())}
      else file=await transcodeVideo(original,$('#videoQuality').value,t=>logUpload(`${original.name}：${t}`));
      if(!['image/jpeg','image/png','image/webp','image/gif','video/mp4','video/webm'].includes(file.type))throw new Error('处理后的文件类型不受 Storage 支持');
      if(file.size>db.settings.runtime.max_upload_bytes)throw new Error('处理后的文件仍超过上传上限');
      const meta=isVideo?await blobVideoInfo(file):{duration:0,width:0,height:0};
      const path=`${user.id}/${Date.now()}_${uid()}_${safeName(file.name)}`;
      logUpload(`${original.name}：上传媒体…`);
      const up=await sb.storage.from('media').upload(path,file,{contentType:file.type||original.type,upsert:false});if(up.error)throw up.error;
      const url=sb.storage.from('media').getPublicUrl(path).data.publicUrl;
      let cover_url='';
      if(isVideo){const cover=await makeVideoCover(file);if(cover){const cp=`${path}.cover.jpg`;const cu=await sb.storage.from('media').upload(cp,cover,{contentType:'image/jpeg',upsert:false});if(!cu.error)cover_url=sb.storage.from('media').getPublicUrl(cp).data.publicUrl}}
      const row={user_id:user.id,account:me().account,url,object_path:path,media_type:isVideo?'video':'image',caption:($('#caption').value||original.name).slice(0,db.settings.runtime.caption_max_length),content_hash:hash,image_hash:ih,video_fingerprint:isVideo?JSON.stringify({...meta,quality:$('#videoQuality').value,frames:[]}):null,file_size:file.size,duration:Math.round(meta.duration||0),cover_url,play_count:0};
      const ins=await sb.from('media_posts').insert(row).select().single();
      if(ins.error){const ps=[path,mediaPathFromUrl(cover_url)].filter(Boolean);await sb.storage.from('media').remove(ps);throw ins.error}
      db.media.unshift({...ins.data,type:ins.data.media_type,duration:ins.data.duration?formatDuration(ins.data.duration):'',file_size:Number(ins.data.file_size||0),play_count:Number(ins.data.play_count||0)});ok++;logUpload(`${original.name}：发布成功 · ${fmtBytes(file.size)}`);progress(Math.round(idx/files.length*100));
    }catch(e){logUpload(`${original.name}：失败 ${errText(e)}`)}
  }
  $('#publishBtn').disabled=false;renderFeed(true);progress(100);toast(`完成：成功 ${ok}，跳过重复 ${skip}，总数 ${files.length}`);
};
$('#publishBtn').onclick=()=>publishFiles([...$('#mediaFiles').files]);
$('#importMediaFile').onchange=e=>publishFiles([...e.target.files]);

// Delete both media object and generated video cover.
const oldViewerDelete=$('#viewerDelete').onclick;
$('#viewerDelete').onclick=async()=>{
  const m=state.viewer;if(!m||!confirm('确认删除此作品及对应 Storage 文件？'))return;
  const d=await sb.from('media_posts').delete().eq('id',m.id);if(d.error)return toast('删除失败：'+errText(d.error));
  const paths=[m.object_path,mediaPathFromUrl(m.cover_url)].filter(Boolean);if(paths.length)await sb.storage.from('media').remove([...new Set(paths)]);
  db.media=db.media.filter(x=>x.id!==m.id);closeModal('viewerModal');renderFeed(true);toast('作品与封面已删除');
};

// Delete previous avatar after a successful replacement to avoid orphan growth.
$('#saveProfile').onclick=async()=>{
  const u=me();if(!u)return;let avatar=u.avatar||'',oldPath=mediaPathFromUrl('');const f=$('#avatarFile').files[0];
  try{
    let oldAvatarPath='';const marker='/storage/v1/object/public/avatars/';if(avatar.includes(marker))oldAvatarPath=decodeURIComponent(avatar.split(marker)[1].split('?')[0]);
    if(f){if(!['image/jpeg','image/png','image/webp','image/gif'].includes(f.type))throw new Error('头像仅支持 JPEG、PNG、WebP 或 GIF 图片');if(f.size>(db.settings.runtime.avatar_max_upload_bytes||5242880))throw new Error('头像文件过大');const path=`${u.id}/${Date.now()}_${safeName(f.name)}`;const up=await sb.storage.from('avatars').upload(path,f,{contentType:f.type,upsert:false});if(up.error)throw up.error;avatar=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;oldPath=oldAvatarPath}
    const nickname=$('#profileNickname').value.trim()||('用户'+u.account.slice(-4)),bio=$('#profileBio').value.trim().slice(0,db.settings.runtime.profile_bio_max_length);const q=await sb.from('profiles').update({nickname,bio,avatar_url:avatar,updated_at:new Date().toISOString()}).eq('id',u.id).select().single();if(q.error)throw q.error;Object.assign(u,{nickname,bio,avatar});if(oldPath)await sb.storage.from('avatars').remove([oldPath]);showHome();toast('资料已保存到数据库')
  }catch(e){toast('保存失败：'+errText(e))}
};

// Keep the admin background current whenever the admin modal opens.

$('#adminBtn').onclick=async()=>{try{const a=await currentAppearance();window.qingyinAppearance=a;window.applyAppearance?.(a)}catch{};openModal('adminModal');renderAdmin('users')};

// Keep online count tied to call Presence when available instead of the demo constant.

const oldUpdateCounts=updateCounts;
updateCounts=function(){oldUpdateCounts()};

// Better install fallback on browsers that do not emit beforeinstallprompt.
$('#installPwa').onclick=async()=>{if(state.installPrompt){await state.installPrompt.prompt();await state.installPrompt.userChoice;state.installPrompt=null}else toast('若浏览器未弹出安装提示，请使用浏览器菜单里的“安装应用/添加到主屏幕”')};
})();
</script>

<!-- qingyin-production-build: background cleanup + realtime refresh + admin compatible build -->
