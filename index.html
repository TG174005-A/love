<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仿抖音网页</title>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 二维码库 -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
        body {background:#000;color:#fff;min-height:100vh;overflow-x:hidden}
        .marquee-wrap {position:fixed;top:0;left:0;width:100%;z-index:999;background:rgba(0,0,0,0.7);padding:6px 0;overflow:hidden}
        .marquee {white-space:nowrap;animation:marquee 20s linear infinite}
        @keyframes marquee {0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
        .container {max-width:1200px;margin:0 auto;padding:15px;padding-top:45px}
        .page {display:none}
        .page.active {display:block}
        .form-box {max-width:400px;margin:50px auto;background:#1a1a1a;padding:25px;border-radius:12px}
        input,textarea,select {width:100%;padding:12px;margin:8px 0;border:none;border-radius:8px;background:#2a2a2a;color:#fff;font-size:16px}
        button {padding:12px 16px;border:none;border-radius:8px;background:#fe2c55;color:#fff;font-weight:bold;cursor:pointer;margin:6px}
        button.gray {background:#444}
        button.blue {background:#0099ff}
        button.green {background:#00c853}
        button.red {background:#f44336}
        .nav {display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
        .card {background:#1e1e1e;padding:15px;border-radius:10px;margin:10px 0}
        .media-item {margin:10px 0}
        video,img {max-width:100%;border-radius:8px}
        .modal {position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:1000;display:none;align-items:center;justify-content:center;padding:15px}
        .modal.show {display:flex}
        .modal-content {background:#181818;width:100%;max-width:700px;max-height:90vh;overflow-y:auto;padding:20px;border-radius:12px}
        .chat-box {height:400px;overflow-y:auto;background:#222;padding:10px;border-radius:8px;margin-bottom:10px}
        .chat-msg {margin:6px 0;padding:8px;border-radius:6px;max-width:75%}
        .chat-left {background:#333;text-align:left;margin-right:auto}
        .chat-right {background:#0088ff;text-align:right;margin-left:auto}
        .admin-tag {font-size:12px;color:#ffd700}
        .grid {display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px}
        .admin-panel {display:none}
        .admin-panel.show {display:block}
        .user-row {display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:#333 1px solid}
        .bg-preview {width:100%;height:120px;background:#333;margin:8px 0;border-radius:8px;background-size:cover;background-position:center}
        .qrcode-wrap {text-align:center;margin:10px 0}
        .toast {position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#222;padding:10px 20px;border-radius:8px;z-index:9999;display:none}
        .toast.show {display:block}
        @media(max-width:768px){
            .grid {grid-template-columns:1fr}
            .modal-content {width:95%}
        }
    </style>
</head>
<body>
    <!-- 跑马灯 -->
    <div class="marquee-wrap">
        <div class="marquee" id="marqueeText">欢迎来到仿抖音平台</div>
    </div>

    <!-- Toast提示 -->
    <div class="toast" id="toast"></div>

    <!-- 登录注册页 -->
    <div class="page active" id="pageLogin">
        <div class="container">
            <div class="form-box">
                <h2>登录 / 注册</h2>
                <div id="loginNotice" style="color:#ffdd00;margin:10px 0"></div>
                <input type="text" id="inpAccount" placeholder="数字账号">
                <input type="password" id="inpPwd" placeholder="密码">
                <button onclick="doLogin()">登录</button>
                <button onclick="doRegister()" class="gray">注册</button>
            </div>
        </div>
    </div>

    <!-- 主页 -->
    <div class="page" id="pageHome">
        <div class="container">
            <div class="nav">
                <button onclick="showProfileModal()">个人资料</button>
                <button onclick="showChatModal()">聊天</button>
                <button onclick="uploadMedia()" class="blue">上传图片/视频</button>
                <button onclick="doLogout()" class="red">退出登录</button>
                <button id="btnAdmin" onclick="showAdminModal()" style="display:none" class="green">后台管理</button>
            </div>
            <h3>我的作品</h3>
            <div id="myMediaList" class="grid"></div>
            <h3>全部作品</h3>
            <div id="allMediaList" class="grid"></div>
        </div>
    </div>

    <!-- 个人资料弹窗 -->
    <div class="modal" id="modalProfile">
        <div class="modal-content">
            <h3>编辑个人资料</h3>
            <input type="text" id="editNick" placeholder="昵称">
            <input type="text" id="editAvatar" placeholder="头像图片链接">
            <textarea id="editBio" placeholder="个人简介"></textarea>
            <button onclick="saveProfile()">保存</button>
            <button onclick="closeModal('modalProfile')" class="gray">关闭</button>
        </div>
    </div>

    <!-- 聊天弹窗 -->
    <div class="modal" id="modalChat">
        <div class="modal-content">
            <h3>聊天室</h3>
            <div style="display:flex;gap:8px;margin-bottom:8px">
                <button onclick="switchChatType('all')" id="btnChatAll" class="blue">全部聊天</button>
                <button onclick="switchChatType('admin')" id="btnChatAdmin">联系管理员</button>
            </div>
            <div class="chat-box" id="chatBox"></div>
            <input type="text" id="chatInput" placeholder="输入消息">
            <button onclick="sendChatMsg()">发送</button>
            <button onclick="closeModal('modalChat')" class="gray">关闭</button>
        </div>
    </div>

    <!-- 后台弹窗 -->
    <div class="modal" id="modalAdmin">
        <div class="modal-content">
            <h2>后台管理面板</h2>
            <div class="admin-panel" id="adminPanel">
                <div>
                    <h4>在线人数：<span id="onlineCount">0</span></h4>
                    <h4>数据库内存信息：<span id="dbInfo">加载中</span></h4>
                </div>
                <hr style="margin:12px 0;border-color:#333">
                <h4>用户管理</h4>
                <div id="userList"></div>
                <hr style="margin:12px 0;border-color:#333">
                <h4>页面背景设置</h4>
                <div>登录页背景URL:<input type="text" id="bgLogin"></div>
                <div>主页背景URL:<input type="text" id="bgHome"></div>
                <div>后台页背景URL:<input type="text" id="bgAdmin"></div>
                <div>登录页透明度:<input type="number" step="0.1" min="0" max="1" id="opLogin"></div>
                <div>主页透明度:<input type="number" step="0.1" min="0" max="1" id="opHome"></div>
                <div>后台页透明度:<input type="number" step="0.1" min="0" max="1" id="opAdmin"></div>
                <div class="bg-preview" id="previewBgLogin"></div>
                <div class="bg-preview" id="previewBgHome"></div>
                <div class="bg-preview" id="previewBgAdmin"></div>
                <button onclick="saveBgConfig()">保存背景配置</button>
                <hr style="margin:12px 0;border-color:#333">
                <h4>视频管理</h4>
                <button onclick="playAllVideo()" class="blue">一键播放全部视频</button>
                <button onclick="deleteAllVideo()" class="red">删除全部视频</button>
                <hr style="margin:12px 0;border-color:#333">
                <h4>跑马灯消息推送</h4>
                <input type="text" id="marqueeInput" placeholder="跑马灯内容">
                <button onclick="pushMarqueeMsg()">发送跑马灯消息</button>
                <hr style="margin:12px 0;border-color:#333">
                <h4>网页设置</h4>
                <input type="text" id="siteTitle" placeholder="网页标题">
                <input type="text" id="shareIconUrl" placeholder="分享图标链接">
                <textarea id="loginNoticeText" placeholder="登录页公告"></textarea>
                <button onclick="saveSiteSetting()">保存网页设置</button>
                <hr style="margin:12px 0;border-color:#333">
                <h4>分享二维码</h4>
                <div class="qrcode-wrap" id="qrcodeDiv"></div>
                <button onclick="createShortcut()">添加到桌面快捷方式</button>
                <hr style="margin:12px 0;border-color:#333">
                <h4>聊天管理</h4>
                <button onclick="clearAllChat()" class="red">删除全部聊天记录</button>
            </div>
            <button onclick="closeModal('modalAdmin')" class="gray">关闭后台</button>
        </div>
    </div>

    <!-- 文件上传隐藏input -->
    <input type="file" id="fileInput" accept="image/*,video/*" style="display:none" onchange="handleFileSelect()">

<script>
// ========== 只声明一次 supabase！！无重复 ==========
const SUPABASE_URL = "https://pzcwzaoebvlghoahpcdr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_mzLfUNyJzIXTX04ORjOuYg_dt-23zIV";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let chatMode = "all";
let siteConfig = {};

// 工具函数
function showToast(msg){
    const el = document.getElementById("toast");
    el.innerText = msg;
    el.classList.add("show");
    setTimeout(()=>el.classList.remove("show"),2000);
}
function openModal(id){document.getElementById(id).classList.add("show");}
function closeModal(id){document.getElementById(id).classList.remove("show");}
function switchPage(id){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

// 登录注册
async function doLogin(){
    const acc = document.getElementById("inpAccount").value.trim();
    const pwd = document.getElementById("inpPwd").value.trim();
    if(!acc || !pwd) return showToast("账号密码不能为空");
    const {data,error} = await supabase.from("users").select("*").eq("account",acc).single();
    if(error || !data){
        return showToast("账号不存在，请先注册");
    }
    if(data.password !== pwd){
        return showToast("密码错误");
    }
    currentUser = data;
    await updateOnlineStatus(true);
    renderUserUI();
    switchPage("pageHome");
    loadSiteConfig();
    loadMedia();
    showToast("登录成功");
}

async function doRegister(){
    const acc = document.getElementById("inpAccount").value.trim();
    const pwd = document.getElementById("inpPwd").value.trim();
    if(!acc || !pwd) return showToast("账号密码不能为空");
    if(!/^\d+$/.test(acc)) return showToast("账号只能为数字");
    const {error} = await supabase.from("users").insert([{account:acc,password:pwd,nickname:"用户"+acc}]);
    if(error){
        return showToast("注册失败，账号已存在");
    }
    showToast("注册成功，请登录");
}

async function doLogout(){
    await updateOnlineStatus(false);
    currentUser = null;
    switchPage("pageLogin");
    showToast("已退出登录");
}

function renderUserUI(){
    // 管理员显示后台按钮
    const btnAdmin = document.getElementById("btnAdmin");
    if(currentUser?.account === "306680070"){
        btnAdmin.style.display="block";
    }else{
        btnAdmin.style.display="none";
    }
}

// 在线状态
async function updateOnlineStatus(isOnline){
    if(!currentUser) return;
    if(isOnline){
        await supabase.from("online_users").upsert([{user_id:currentUser.id,last_active:new Date()}],{onConflict:"user_id"});
    }else{
        await supabase.from("online_users").delete().eq("user_id",currentUser.id);
    }
}

// 个人资料
async function showProfileModal(){
    if(!currentUser)return;
    document.getElementById("editNick").value = currentUser.nickname || "";
    document.getElementById("editAvatar").value = currentUser.avatar || "";
    document.getElementById("editBio").value = currentUser.bio || "";
    openModal("modalProfile");
}
async function saveProfile(){
    const nick = document.getElementById("editNick").value.trim();
    const ava = document.getElementById("editAvatar").value.trim();
    const bio = document.getElementById("editBio").value.trim();
    const {error} = await supabase.from("users").update({nickname:nick,avatar:ava,bio:bio}).eq("id",currentUser.id);
    if(!error){
        currentUser.nickname = nick;
        currentUser.avatar = ava;
        currentUser.bio = bio;
        showToast("资料保存成功");
        closeModal("modalProfile");
    }else{
        showToast("保存失败");
    }
}

// 文件上传（需要supabase storage bucket media）
function uploadMedia(){
    if(!currentUser) return showToast("请登录");
    document.getElementById("fileInput").click();
}
async function handleFileSelect(e){
    const file = e.target.files[0];
    if(!file)return;
    const fileName = `${Date.now()}_${file.name}`;
    const {data,error} = await supabase.storage.from("media").upload(fileName,file);
    if(error){
        return showToast("上传失败，请确认storage bucket media已创建");
    }
    const url = supabase.storage.from("media").getPublicUrl(fileName).data.publicUrl;
    const type = file.type.startsWith("video")?"video":"image";
    await supabase.from("media").insert([{user_id:currentUser.id,file_url:url,file_type:type}]);
    showToast("上传成功");
    loadMedia();
}

async function loadMedia(){
    if(!currentUser) return;
    const {data:myList} = await supabase.from("media").select("*").eq("user_id",currentUser.id).order("created_at",{ascending:false});
    const {data:allList} = await supabase.from("media").select("*").order("created_at",{ascending:false});
    const myDom = document.getElementById("myMediaList");
    const allDom = document.getElementById("allMediaList");
    myDom.innerHTML="";
    allDom.innerHTML="";
    myList.forEach(item=>{
        myDom.innerHTML+=renderMediaItem(item);
    });
    allList.forEach(item=>{
        allDom.innerHTML+=renderMediaItem(item);
    });
}
function renderMediaItem(item){
    if(item.file_type === "video"){
        return `<div class="media-item card"><video controls src="${item.file_url}" width="100%"></video></div>`;
    }else{
        return `<div class="media-item card"><img src="${item.file_url}" alt="图片"></div>`;
    }
}

// 聊天模块
async function showChatModal(){
    if(!currentUser)return showToast("请登录");
    openModal("modalChat");
    loadChatMsg();
}
function switchChatType(t){
    chatMode = t;
    loadChatMsg();
}
async function loadChatMsg(){
    let q = supabase.from("chat_messages").select("*").order("created_at",{ascending:true});
    if(chatMode === "admin"){
        q = q.or(`is_admin_reply.eq(true),user_id.eq(${currentUser.id})`);
    }
    const {data} = await q;
    const box = document.getElementById("chatBox");
    box.innerHTML="";
    data.forEach(m=>{
        const cls = m.user_id === currentUser.id ? "chat-right":"chat-left";
        let tag = "";
        if(m.is_admin_reply) tag = `<span class="admin-tag">[管理员]</span>`;
        box.innerHTML+=`<div class="chat-msg ${cls}">${tag}${m.username}:${m.content}</div>`;
    });
    box.scrollTop = box.scrollHeight;
}
async function sendChatMsg(){
    const txt = document.getElementById("chatInput").value.trim();
    if(!txt)return;
    const uname = currentUser.nickname || currentUser.account;
    await supabase.from("chat_messages").insert([{
        user_id:currentUser.id,
        username:uname,
        content:txt,
        is_admin_reply:false
    }]);
    document.getElementById("chatInput").value="";
    loadChatMsg();
}

// 后台管理
async function showAdminModal(){
    if(currentUser.account !== "306680070")return;
    openModal("modalAdmin");
    document.getElementById("adminPanel").classList.add("show");
    await loadAdminData();
    generateQrcode();
}

async function loadAdminData(){
    //在线人数
    const {data:onlineData} = await supabase.from("online_users").select("*");
    document.getElementById("onlineCount").innerText = onlineData.length;

    // 用户列表
    const {data:userList} = await supabase.from("users").select("*");
    const userDom = document.getElementById("userList");
    userDom.innerHTML="";
    userList.forEach(u=>{
        userDom.innerHTML+=`
        <div class="user-row">
            <div>账号:${u.account} | 昵称:${u.nickname}</div>
            <div>
                <button onclick="editUserPwd(${u.id})" class="blue">改密码</button>
                <button onclick="deleteUser(${u.id})" class="red">删除账号</button>
            </div>
        </div>
        `;
    });

    // 加载配置
    const {data:cfg} = await supabase.from("site_config").select("*").limit(1).single();
    siteConfig = cfg;
    document.getElementById("bgLogin").value = cfg.login_bg||"";
    document.getElementById("bgHome").value = cfg.home_bg||"";
    document.getElementById("bgAdmin").value = cfg.admin_bg||"";
    document.getElementById("opLogin").value = cfg.login_opacity||1;
    document.getElementById("opHome").value = cfg.home_opacity||1;
    document.getElementById("opAdmin").value = cfg.admin_opacity||1;
    document.getElementById("siteTitle").value = cfg.site_title||"";
    document.getElementById("shareIconUrl").value = cfg.share_icon||"";
    document.getElementById("loginNoticeText").value = cfg.notice||"";
    document.getElementById("marqueeInput").value = cfg.marquee_text||"";

    document.getElementById("previewBgLogin").style.backgroundImage = `url(${cfg.login_bg})`;
    document.getElementById("previewBgHome").style.backgroundImage = `url(${cfg.home_bg})`;
    document.getElementById("previewBgAdmin").style.backgroundImage = `url(${cfg.admin_bg})`;

    document.getElementById("dbInfo").innerText = "已获取配置";
}

async function editUserPwd(uid){
    const newPwd = prompt("输入新密码");
    if(!newPwd)return;
    await supabase.from("users").update({password:newPwd}).eq("id",uid);
    showToast("密码修改完成");
    loadAdminData();
}
async function deleteUser(uid){
    if(!confirm("确认删除该账号？"))return;
    await supabase.from("users").delete().eq("id",uid);
    showToast("账号已删除");
    loadAdminData();
}

async function saveBgConfig(){
    const loginBg = document.getElementById("bgLogin").value.trim();
    const homeBg = document.getElementById("bgHome").value.trim();
    const adminBg = document.getElementById("bgAdmin").value.trim();
    const opLogin = Number(document.getElementById("opLogin").value);
    const opHome = Number(document.getElementById("opHome").value);
    const opAdmin = Number(document.getElementById("opAdmin").value);
    await supabase.from("site_config").update({
        login_bg:loginBg,
        home_bg:homeBg,
        admin_bg:adminBg,
        login_opacity:opLogin,
        home_opacity:opHome,
        admin_opacity:opAdmin,
        updated_at:new Date()
    }).eq("id",1);
    showToast("背景配置保存成功");
    loadSiteConfig();
    loadAdminData();
}

async function playAllVideo(){
    const {data} = await supabase.from("media").select("file_url").eq("file_type","video");
    data.forEach(item=>{
        const v = document.createElement("video");
        v.src = item.file_url;
        v.play();
    });
    showToast("已触发全部视频播放");
}
async function deleteAllVideo(){
    if(!confirm("确定删除全部视频？"))return;
    await supabase.from("media").delete().eq("file_type","video");
    showToast("全部视频已删除");
    loadMedia();
}

async function pushMarqueeMsg(){
    const txt = document.getElementById("marqueeInput").value.trim();
    if(!txt)return;
    await supabase.from("site_config").update({marquee_text:txt,updated_at:new Date()}).eq("id",1);
    showToast("跑马灯消息已推送");
    loadSiteConfig();
}

async function saveSiteSetting(){
    const title = document.getElementById("siteTitle").value.trim();
    const icon = document.getElementById("shareIconUrl").value.trim();
    const notice = document.getElementById("loginNoticeText").value.trim();
    await supabase.from("site_config").update({
        site_title:title,
        share_icon:icon,
        notice:notice,
        updated_at:new Date()
    }).eq("id",1);
    document.title = title;
    showToast("网页设置保存成功");
    loadSiteConfig();
    generateQrcode();
}

async function clearAllChat(){
    if(!confirm("确认清空全部聊天记录？"))return;
    await supabase.from("chat_messages").delete();
    showToast("聊天记录已清空");
    loadChatMsg();
}

function generateQrcode(){
    const div = document.getElementById("qrcodeDiv");
    div.innerHTML="";
    new QRCode(div,{
        text:window.location.href,
        width:180,
        height:180
    });
}

function createShortcut(){
    if(window.hasOwnProperty('InstallTrigger')){
        InstallTrigger.install({
            name:"仿抖音网页",
            URL:window.location.href,
            iconURL:siteConfig.share_icon
        });
    }else{
        showToast("浏览器不支持一键添加桌面快捷方式，请手动添加");
    }
}

// 加载全局配置
async function loadSiteConfig(){
    const {data} = await supabase.from("site_config").select("*").limit(1).single();
    siteConfig = data;
    document.getElementById("marqueeText").innerText = data.marquee_text;
    document.title = data.site_title;
    document.getElementById("loginNotice").innerText = data.notice;
}

// 实时订阅
supabase.channel("all").on('postgres_changes',{event:'*',schema:'public',table:'site_config'},()=>{
    loadSiteConfig();
}).subscribe();

// 页面初始化
window.onload = async ()=>{
    await loadSiteConfig();
}
</script>
</body>
</html>
