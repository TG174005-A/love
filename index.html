if('serviceWorker' in navigator){
  const swCode = `self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());`

// 粒子星空
const canvas = document.getElementById('particleCanvas')
const ctx = canvas.getContext('2d')
let particles = []
function resizeCanvas(){canvas.width=innerWidth;canvas.height=innerHeight}
resizeCanvas();window.addEventListener('resize',resizeCanvas)
class Particle{
  constructor(){
    this.x=Math.random()*canvas.width
    this.y=Math.random()*canvas.height
    this.vx=(Math.random()-0.5)*0.35
    this.vy=(Math.random()-0.5)*0.35
    this.r=Math.random()*1.8+0.4
    this.hue=Math.random()*120+180
  }
  update(){
    this.x+=this.vx;this.y+=this.vy
    if(this.x<0||this.x>canvas.width)this.vx*=-1
    if(this.y<0||this.y>canvas.height)this.vy*=-1
  }
  draw(){
    ctx.beginPath()
    ctx.arc(this.x,this.y,this.r,0,Math.PI*2)
    ctx.fillStyle=`hsla(${this.hue},100%,70%,0.7)`
    ctx.fill()
  }
}
for(let i=0;i<120;i++) particles.push(new Particle())
function animParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height)
  particles.forEach(p=>{p.update();p.draw()})
  requestAnimationFrame(animParticles)
}
animParticles()

document.getElementById('loginBtn').onclick = async ()=>{
  const acc = document.getElementById('loginAccount').value.trim()
  const pwd = document.getElementById('loginPwd').value.trim()
  if(!acc||!pwd){showToast("账号密码不能为空");return}
  let {data:userRow} = await supabase.from('users').select('*').eq('account',acc).single()
  const isRegTab = document.getElementById('tabReg').className.includes('btn-neon')
  if(isRegTab){
    if(userRow){showToast("该账号已存在");return}
    const hashPwd = bcrypt.hashSync(pwd, saltRounds)
    await supabase.from('users').insert([{account:acc,password_hash:hashPwd,nickname:"用户"+acc,is_admin:false,avatar_url:""}])
    showToast("注册成功，请登录")
    return
  }else{
    if(!userRow){showToast("账号不存在，请先注册");return}
    const ok = bcrypt.compareSync(pwd, userRow.password_hash)
    if(!ok){showToast("密码错误");return}
    currentAccount = acc
    currentUserRow = userRow
    document.getElementById('curUser').innerText = userRow.nickname
    document.getElementById('homeAvatar').src = userRow.avatar_url || defaultAvatar
    document.getElementById('nickName').value = userRow.nickname
    document.getElementById('avatarPreview').src = userRow.avatar_url || defaultAvatar
    if(acc === SUPER_ADMIN || userRow.is_admin === true){
      document.getElementById('adminBtn').style.display='block'
      document.getElementById('adminLevel').innerText = acc===SUPER_ADMIN?"【超级管理员】":"【普通管理员】"
    }else{
      document.getElementById('adminBtn').style.display='none'
    }
    showPage('homePage')
    await loadUserMap()
    loadMedia();loadMarquee();loadNotice();loadUsers();loadDbInfo();refreshDmUnread()
    await supabase.from('online_users').upsert([{account:acc,last_time:new Date().toISOString()}])
    refreshOnline()
    subscribeRealtime()
  }
}

// 修改昵称头像
document.getElementById('saveProfileBtn').onclick = async ()=>{
  const nick = document.getElementById('nickName').value.trim()
  let newAvatarUrl = currentUserRow.avatar_url || ""
  const avatarFile = document.getElementById('avatarFile').files[0]
  if(avatarFile){
    const ext = avatarFile.name.split('.').pop()
    const fname = "avatar_"+Date.now()+"_"+Math.random().toString(36).slice(2)+"."+ext
    const {data:upRes,error} = await supabase.storage.from('media').upload(fname,avatarFile)
    if(error){showToast("头像上传失败:"+error.message);return}
    const {data:pubUrl} = supabase.storage.from('media').getPublicUrl(fname)
    newAvatarUrl = pubUrl.data.publicUrl
  }
  await supabase.from('users').update({nickname:nick,avatar_url:newAvatarUrl}).eq('account',currentAccount)
  currentUserRow.nickname = nick
  currentUserRow.avatar_url = newAvatarUrl
  document.getElementById('curUser').innerText = nick
  document.getElementById('homeAvatar').src = newAvatarUrl || defaultAvatar
  document.getElementById('avatarPreview').src = newAvatarUrl || defaultAvatar
  await loadUserMap()
  showToast("昵称&头像保存成功 ✅")
  loadMedia()
}
document.getElementById('avatarFile').onchange = (e)=>{
  const file = e.target.files[0]
  if(!file) return
  const reader = new FileReader()
  reader.onload = ev=>{document.getElementById('avatarPreview').src = ev.target.result}
  reader.readAsDataURL(file)
}

// 上传作品
document.getElementById('fileUpload').onchange = async (e)=>{
  const file = e.target.files[0]
  if(!file) return
  const ext = file.name.split('.').pop()
  const fname = Date.now()+"_"+Math.random().toString(36).slice(2)+"."+ext
  const {data:upRes,error} = await supabase.storage.from('media').upload(fname,file)
  if(error){showToast("上传失败:"+error.message);return}
  const {data:pubUrl} = supabase.storage.from('media').getPublicUrl(fname)
  const type = file.type.startsWith('video')?'video':'image'
  await supabase.from('medias').insert([{account:currentAccount,url:pubUrl.data.publicUrl,media_type:type}])
  showToast("上传成功 ✅")
  closeUpload()
  loadMedia()
}

// 渲染作品
async function renderMediaList(mediaArr, wrapDom){
  wrapDom.innerHTML = ''
  for(const item of mediaArr){
    const {count:cmtCount} = await supabase.from('comments').select('*',{count:'exact',head:true}).eq('media_id',item.id)
    const {count:likeCount} = await supabase.from('likes').select('*',{count:'exact',head:true}).eq('media_id',item.id)
    const {count:viewCount} = await supabase.from('views').select('*',{count:'exact',head:true}).eq('media_id',item.id)
    const {data:myLike} = await supabase.from('likes').select('id').eq('media_id',item.id).eq('account',currentAccount).single()
    const hasLiked = !!myLike
    const authorInfo = userMap[item.account] || {nickname:item.account,avatar_url:defaultAvatar}
    const canDelete = (item.account === currentAccount) || (currentAccount === SUPER_ADMIN)
    const div = document.createElement('div')
    div.className="douyin-item"
    let html = `
      <div class="media-info" data-author-acc="${item.account}">
        <img class="avatar-img" src="${authorInfo.avatar_url}">
        <span>${authorInfo.nickname}</span>
      </div>
      <div class="side-action">
        <div>👁️</div>
        <div class="count-text">${viewCount||0}</div>
        <button class="likeBtn ${hasLiked?'liked':''}">❤️</button>
        <div class="count-text">${likeCount||0}</div>
        <button class="openCommentBtn">💬</button>
        <div class="count-text">${cmtCount||0}</div>
        <button class="dmAuthorBtn">✉️</button>
        ${canDelete ? `<button class="delMediaBtn">🗑️</button>` : ``}
      </div>`
    if(item.media_type==='video'){
      div.innerHTML = `<video src="${item.url}" loop muted playsinline></video>` + html
    }else{
      div.innerHTML = `<img src="${item.url}">` + html
    }
    div.querySelector('.media-info').onclick = ()=>{ openUserProfile(item.account) }
    div.querySelector('.likeBtn').onclick = async ()=>{
      if(hasLiked){
        await supabase.from('likes').delete().eq('media_id',item.id).eq('account',currentAccount)
      }else{
        await supabase.from('likes').insert([{media_id:item.id,account:currentAccount}])
      }
      loadMedia()
      if(profileViewAccount) loadProfileMedia()
    }
    div.querySelector('.openCommentBtn').onclick = ()=>{
      currentCommentMediaId = item.id
      openCommentPanel()
    }
    div.querySelector('.dmAuthorBtn').onclick = ()=>{ openDmModal(item.account) }
    const delBtn = div.querySelector('.delMediaBtn')
    if(delBtn){
      delBtn.onclick = async ()=>{
        if(!confirm("确认删除这个作品？该作品所有评论+点赞+浏览记录一并删除，不可恢复！")) return
        await supabase.from('comments').delete().eq('media_id',item.id)
        await supabase.from('likes').delete().eq('media_id',item.id)
        await supabase.from('views').delete().eq('media_id',item.id)
        await supabase.from('medias').delete().eq('id',item.id)
        showToast("作品删除成功 ✅")
        loadMedia()
        if(profileViewAccount) loadProfileMedia()
      }
    }
    wrapDom.appendChild(div)
  }
  const observer = new IntersectionObserver((entries)=>{
    entries.forEach(async entry=>{
      const v = entry.target.querySelector('video')
      if(entry.isIntersecting){
        if(v){v.play().catch(()=>{});currentPlayVideo = v}
        const mediaId = mediaArr.find(m=>{
          return entry.target.querySelector('video')?.src === m.url || entry.target.querySelector('img')?.src === m.url
        })?.id
        if(mediaId){
          await supabase.from('views').upsert([{media_id:mediaId,account:currentAccount}],{onConflict:'media_id,account'})
        }
      }else{
        if(v) v.pause()
      }
    })
  },{threshold:0.6})
  wrapDom.querySelectorAll('.douyin-item').forEach(el=>observer.observe(el))
}

async function loadMedia(){
  const {data} = await supabase.from('medias').select('*').order('created_at',{ascending:false})
  mediaList = data || []
  await renderMediaList(mediaList, document.getElementById('douyinWrap'))
}

async function loadCommentList(){
  if(!currentCommentMediaId) return
  const {data} = await supabase.from('comments').select('*').eq('media_id',currentCommentMediaId).order('created_at')
  const box = document.getElementById('commentList')
  box.innerHTML = ''
  if(!data || data.length===0){
    box.innerHTML = `<div style="text-align:center;color:#888;padding:30px">暂无评论，快来抢沙发 ✨</div>`
    return
  }
  data.forEach(c=>{
    const uInfo = userMap[c.account] || {nickname:c.account,avatar_url:defaultAvatar}
    const el = document.createElement('div')
    el.className="comment-item"
    el.innerHTML = `<img class="avatar-img" style="width:32px;height:32px" src="${uInfo.avatar_url}"><div><b>${uInfo.nickname}</b>：${c.content}</div>`
    box.appendChild(el)
  })
  box.scrollTop = box.scrollHeight
}

// ✅ 私信DM完整代码（本次补齐，无截断）
document.getElementById('openDmBtn').onclick = ()=>{
  document.getElementById('dmModal').classList.add('open')
}
function closeDm(){document.getElementById('dmModal').classList.remove('open')}
function openDmModal(targetAcc){
  document.getElementById('dmModal').classList.add('open')
  document.getElementById('dmTargetAcc').value = targetAcc
  dmTargetAccount = targetAcc
  loadDmList()
}
document.getElementById('loadDmBtn').onclick = async ()=>{
  const target = document.getElementById('dmTargetAcc').value.trim()
  if(!target){showToast("请输入对方账号");return}
  if(target === currentAccount){showToast("不能给自己发私信");return}
  dmTargetAccount = target
  loadDmList()
}
async function loadDmList(){
  if(!dmTargetAccount) return
  const {data} = await supabase.from('private_msgs')
    .select('*')
    .or(`and(from_account.eq.${currentAccount},to_account.eq.${dmTargetAccount}),and(from_account.eq.${dmTargetAccount},to_account.eq.${currentAccount})`)
    .order('created_at')
  const box = document.getElementById('dmBox')
  box.innerHTML = ''
  if(!data || data.length===0){
    box.innerHTML = `<div style="text-align:center;color:#888;padding:30px">暂无私信，开始聊天吧 ✨</div>`
    return
  }
  data.forEach(m=>{
    const el = document.createElement('div')
    if(m.from_account === currentAccount){
      el.style.cssText = "margin-left:auto;background:#3060ff;padding:8px 12px;border-radius:12px;margin-top:6px;max-width:75%"
    }else{
      el.style.cssText = "margin-right:auto;background:#353b70;padding:8px 12px;border-radius:12px;margin-top:6px;max-width:75%"
    }
    el.innerText = m.content
    box.appendChild(el)
  })
  box.scrollTop = box.scrollHeight
  // ✅ 打开对话后，清零未读
  await supabase.from('dm_unread').delete().eq('to_account',currentAccount).eq('from_account',dmTargetAccount)
  refreshDmUnread()
}
document.getElementById('sendDmBtn').onclick = async ()=>{
  const txt = document.getElementById('dmInput').value.trim()
  if(!txt){showToast("私信内容不能为空");return}
  if(!dmTargetAccount){showToast("请先选择私信对象");return}
  await supabase.from('private_msgs').insert([{
    from_account:currentAccount,
    to_account:dmTargetAccount,
    content:txt,
    created_at:new Date().toISOString()
  }])
  // ✅ 写入未读计数（对方未读+1）
  await supabase.from('dm_unread').upsert([{
    to_account:dmTargetAccount,
    from_account:currentAccount,
    unread_count:1
  }],{onConflict:'to_account,from_account'})
  document.getElementById('dmInput').value = ''
  showToast("私信发送成功 ✅")
  loadDmList()
}
// ✅ 刷新私信未读红点总数
async function refreshDmUnread(){
  const {data} = await supabase.from('dm_unread').select('unread_count').eq('to_account',currentAccount)
  let total = 0
  data?.forEach(i=> total += i.unread_count)
  const badge = document.getElementById('dmBadge')
  badge.innerText = total
  if(total>0){badge.classList.add('show')}else{badge.classList.remove('show')}
